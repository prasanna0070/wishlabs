server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  gzip on;
  # The load balancer's front end marks requests as proxied (Via), and nginx skips gzip for those unless told.
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;  # text/html is always gzipped
  add_header X-Content-Type-Options nosniff always;
  location /assets/ { expires 7d; add_header Cache-Control "public, max-age=604800"; }
  location /css/ { expires 1h; add_header Cache-Control "public, max-age=3600"; }
  # Site switches (SHARE_URL, NEW_FEATURES) live here: always revalidate so a redeploy shows at once.
  location = /js/config.js { add_header Cache-Control "no-cache"; }
  location /js/ { expires 1h; add_header Cache-Control "public, max-age=3600"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /favicon.ico { try_files /assets/img/favicon.ico =404; expires 7d; }
  location / { try_files $uri $uri/ /index.html; }
}
