# Wish Labs print profile for PrusaSlicer 2.7 (vendored from ../sim/shell/slice.ini, 2026-11-01).
# Target printer: Prusa i3 MK3S-class FDM, 0.4 mm nozzle, 250 x 210 x 210 mm build volume, PETG for every part.
# Additions to the sim profile, for machine-readable stats only (no change to the toolpath settings):
#   use_relative_e_distances = 1  so per-feature filament (support vs part) can be summed from the G-code
#   layer_gcode = G92 E0          required by PrusaSlicer with relative E
#   binary_gcode = 0              plain-text G-code with the summary comments the parser reads
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = gyroid
support_material = 1
support_material_auto = 1
support_material_buildplate_only = 1
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_density = 1.27
filament_cost = 1900
filament_type = PETG
temperature = 240
first_layer_temperature = 240
bed_temperature = 80
first_layer_bed_temperature = 80
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 210
gcode_flavor = marlin2
use_relative_e_distances = 1
layer_gcode = G92 E0
binary_gcode = 0
