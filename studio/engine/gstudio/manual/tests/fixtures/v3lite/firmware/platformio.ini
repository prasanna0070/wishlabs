; PlatformIO project for "Sleepy Bear" (story_player template). Generated by Gadget Studio.
; Toolchain and library versions are pinned for a reproducible build. Build:  pio run -e s3
; Flash over USB:  pio run -e s3 -t upload      Native unit tests:  pio test -e native
[platformio]
default_envs = s3
description = Sleepy Bear firmware (story_player)

[env:s3]
platform = platformio/espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3-DevKitC-1 N8R8: 8 MB quad flash, 8 MB octal PSRAM (GPIO35-37 belong to the PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.csv
monitor_speed = 115200
; -ffile-prefix-map strips this folder's path from __FILE__ and debug info, so the same sources give
; the same firmware.bin wherever the project sits (the image embeds the ELF's SHA-256).
build_flags =
  -DBOARD_HAS_PSRAM
  -ffile-prefix-map=$PROJECT_DIR=.
lib_ldf_mode = chain
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  adafruit/Adafruit NeoPixel@1.15.5
  olikraus/U8g2@2.36.18
extra_scripts = pre:scripts/prebuild.py

; Host unit tests of the hardware-free logic in lib/gs_core (no board needed).
[env:native]
platform = platformio/native@1.2.1
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -DGS_NATIVE=1
lib_deps =
  throwtheswitch/Unity@2.6.1
